{% extends 'base.html' %}
{% block title %}Account — Group 9{% endblock %}

{% block content %}
<div class="page-header">
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">← Back to Dashboard</a>
    <h1>Account Management</h1>
</div>

<div class="form-grid">

    <!-- Update Profile -->
    <div class="card">
        <h2>Update Profile</h2>
        <form method="POST" action="{{ url_for('account.account') }}">
            <input type="hidden" name="action" value="update_profile">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ admin.full_name }}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ admin.email }}" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ admin.username }}" disabled>
                <small>Username cannot be changed.</small>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>

    <!-- Change Password -->
    <div class="card">
        <h2>Change Password</h2>
        <form method="POST" action="{{ url_for('account.account') }}">
            <input type="hidden" name="action" value="change_password">

            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password"
                       placeholder="Minimum 6 characters" required>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>

</div>
{% endblock %}
