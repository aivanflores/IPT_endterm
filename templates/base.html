<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Group 9 Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% if session.user %}
<nav class="navbar">
    <div class="nav-brand">AI Student Impact</div>
    <div class="nav-links">
        <a href="{{ url_for('dashboard.index') }}" class="nav-link">Dashboard</a>
        <a href="{{ url_for('reflections.reflections') }}" class="nav-link">Reflections</a>
        <a href="{{ url_for('account.account') }}" class="nav-link">Account</a>
        <a href="{{ url_for('auth.logout') }}" class="nav-link logout">Logout</a>
    </div>
</nav>
{% endif %}

<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
